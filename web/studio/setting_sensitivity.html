<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定原帧的参数响应</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0e1824;color:#dce9f5}body{max-width:1380px;margin:auto;padding:22px}p{line-height:1.6}.notice{padding:12px 16px;background:#293249;border-left:4px solid #efbb74}label{display:inline-block;margin:0 20px 15px 0}select{background:#203347;color:inherit;padding:9px;border:1px solid #60788b;border-radius:6px}iframe{width:100%;height:760px;border:1px solid #3c526a;border-radius:6px;background:#0b1420}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #344b60;padding:10px;text-align:left}.scroll{overflow:auto}a{color:#91d3e8}small{color:#a9c0d4}details{margin:18px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){iframe{height:1100px}body{padding:12px}}</style>
<h1>同一批原帧，体素与截断改变了什么？</h1><p class="notice">两份结果都不是物理真值。点数更少、表面更平滑或最近邻距离小，均不能单独证明重建更准确；体素与截断共同改变，不能归因于单个参数。</p><p id="facts"></p><label>固定校正关系 <select id="arm"><option value="0">原位姿控制</option><option value="1">冻结片段校正</option></select></label><label>显示内容 <select id="mode"><option value="surface">原表面</option><option value="distance">最近邻距离着色</option></select></label><a id="external" target="_blank" rel="noopener">独立打开双栏 ↗</a><p id="legend"><small>距离着色时，在双栏工具条选择“原顶点色”：青绿≤0.25mm，浅绿≤0.5mm，橙≤1mm，红&gt;1mm。颜色是显示伪彩，不是物体RGB。</small></p><iframe id="comparison" title="相同原帧不同参数的双栏对照"></iframe>
<h2>完整表面之间的距离</h2><p><small>使用全部顶点的双向最近邻；显示抽样不参与下表统计，顶点编号仅在各自模型内部有意义。</small></p><div class="scroll"><table><thead><tr><th>校正关系</th><th>方向</th><th>点数</th><th>中位 mm</th><th>P95 mm</th><th>最大 mm</th><th>≤0.5mm</th><th>≤1mm</th></tr></thead><tbody id="rows"></tbody></table></div><details><summary>固定条件与历史默认复现</summary><pre id="provenance"></pre></details><p><a href="summary.json">完整数值与来源SHA</a> · <a href="/">回到工作台</a></p>
<script id="setting-data" type="application/json">__SETTING_DATA__</script><script>(()=>{'use strict';const $=id=>document.getElementById(id),raw=$('setting-data').textContent;if(raw.trim()==='__SETTING_DATA__'){$('facts').textContent='开发模板，请从工作台实验目录打开已生成结果。';return;}const data=JSON.parse(raw);function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}$('facts').textContent='同一'+data.selected_frames+'帧与原ROI像素；'+data.fine_settings.voxel_mm+'mm体素/'+data.fine_settings.truncation_mm+'mm截断，对比'+data.coarse_settings.voxel_mm+'mm体素/'+data.coarse_settings.truncation_mm+'mm截断。深度跳变与提取权重均保留，未增加新扫描或重新配准。';for(const arm of data.arms)for(const [key,direction] of [['fine_to_coarse','细→粗'],['coarse_to_fine','粗→细']]){const d=arm[key],tr=node('tr','');for(const value of [arm.label==='saved'?'原位姿控制':'冻结片段校正',direction,d.points.toLocaleString(),d.median_mm.toFixed(3),d.p95_mm.toFixed(3),d.maximum_mm.toFixed(3),...d.within.filter(r=>r.distance_mm===.5||r.distance_mm===1).map(r=>(100*r.fraction).toFixed(2)+'%')])tr.append(node('td',String(value)));$('rows').append(tr);}$('provenance').textContent='细参数任务 '+data.fine_job+'\n粗参数任务 '+data.coarse_job+'\n历史默认任务 '+data.historical_job+'\n原像素SHA '+data.original_roi_pixel_sha256+'\n'+data.arms.map(a=>a.label+'：'+a.fine_points+'→'+a.coarse_points+'点；相同应用位姿='+a.same_applied_pose_arrays+'；原载荷文件='+a.same_original_payload_files+'；当前默认对历史默认全点双向最大距离='+a.historical_default_bidirectional_max_mm+'mm（执行复现，不是物理误差）').join('\n');function show(){const arm=data.arms[Number($('arm').value)],url=arm.pages[$('mode').value];$('comparison').src=url;$('external').href=url;}$('arm').onchange=$('mode').onchange=show;show();})();</script></html>
