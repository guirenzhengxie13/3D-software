[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruction-probe"
version = "0.1.0"
description = "Point-cloud input prototype for an interactive reconstruction project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
viewer = [
  "open3d>=0.19,<0.21; python_version < '3.13'",
  "open3d>=0.20,<0.21; python_version >= '3.13'",
]
review = ["pillow>=12,<13"]

[project.scripts]
reconstruction-probe = "reconstruction_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
